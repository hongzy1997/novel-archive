# ============================================================
# Novel Archive Frontend
# nginx Configuration
# ============================================================

server {
    # Frontendコンテナ内部の待受ポート
    listen 80;

    server_name localhost;


    # ========================================================
    # React
    # ========================================================

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # React Routerによる画面遷移に対応するため、
        # 対象ファイルが存在しない場合はindex.htmlを返す。
        try_files $uri $uri/ /index.html;
    }


    # ========================================================
    # Backend API
    # ========================================================

    location /api/ {
        # Docker Composeのservice名「backend」を利用して
        # Spring Bootへリクエストを転送する。
        proxy_pass http://backend:8080;

        # 元リクエスト情報をBackendへ引き継ぐ。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}